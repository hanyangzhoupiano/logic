<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logic Gates</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div id="title-screen" class="panel">
      <h1>Logic Gates</h1>
      <p class="subtitle">Defend the Core. Build circuits. Survive 50 waves.</p>
      <button id="btn-play" type="button">Play</button>
    </div>

    <div id="hud" hidden>
      <div id="hud-info" class="panel">
        <h1 id="wave-title">Wave 0 / 50</h1>
        <p id="wave-status">Prepare — 30s</p>
      </div>
      <div class="hud-right">
        <div id="core-hud" class="panel">Core HP —</div>
        <button id="btn-menu" class="panel btn-menu" type="button">Menu</button>
      </div>
    </div>
    <div id="hint" class="panel" hidden>Drag · Q/E rotate while dragging · Backspace delete while dragging · double-click number to edit</div>

    <div id="pick-overlay" hidden>
      <div class="panel pick-card">
        <h2>Choose a component</h2>
        <p class="pick-sub">Wave milestone — pick 1 of 3 (you also get a free crossbow)</p>
        <div id="pick-choices"></div>
      </div>
    </div>

    <div id="end-overlay" hidden>
      <div class="panel end-card">
        <h2 id="end-title">Game Over</h2>
        <p id="end-msg"></p>
        <button id="btn-restart" type="button">Restart</button>
        <button id="btn-end-menu" class="secondary" type="button">Menu</button>
      </div>
    </div>

    <input id="num-edit" type="number" hidden />
  </div>
  <script src="main.js"></script>
</body>
</html>
